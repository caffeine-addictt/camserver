name: Run Tests

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  changed-files:
    name: Changed Files
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.changed-files.outputs.source_any_modified == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 50 # Assume PRs are less than 50 commits

      - name: Find changed files
        uses: tj-actions/changed-files@v47
        id: changed-files
        with:
          files_yaml: |
            source:
              - .github/workflows/ci.yml
              - Makefile
              - go.*
              - '**/*.go'

  testing:
    name: Testing
    runs-on: ubuntu-latest
    needs: changed-files
    if: needs.changed-files.outputs.source == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            /go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}

      - name: Testing
        run: |
          make test

      - name: Linting
        run: |
          make lint

      - name: Security
        continue-on-error: true
        run: |
          make security

  docker:
    name: "Docker"
    runs-on: ubuntu-latest
    needs: [testing]
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push next (Main)
        uses: docker/build-push-action@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          context: .
          cache-from: type=registry,ref=ghcr.io/caffeine-addictt/camserver-daemon:buildcache
          cache-to: type=registry,ref=ghcr.io/caffeine-addictt/camserver-daemon:buildcache,mode=max
          push: true
          tags: |
            ghcr.io/caffeine-addictt/camserver-daemon:next
            ghcr.io/caffeine-addictt/camserver-daemon:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/caffeine-addictt

      - name: Build and release (latest)
        uses: docker/build-push-action@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          context: .
          cache-from: type=registry,ref=ghcr.io/caffeine-addictt/camserver-daemon:buildcache
          cache-to: type=registry,ref=ghcr.io/caffeine-addictt/camserver-daemon:buildcache,mode=max
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/caffeine-addictt/camserver-daemon:next' || '' }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/caffeine-addictt/camserver-daemon:{0}', github.sha) || '' }}
            ${{ startsWith(github.ref, 'refs/tags/v') && 'ghcr.io/caffeine-addictt/camserver-daemon:latest' || '' }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/caffeine-addictt/camserver-daemon:{0}', github.ref_name) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/caffeine-addictt
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

  check:
    if: always()
    name: Tests Successful
    runs-on: ubuntu-latest
    needs: [testing, docker]

    steps:
      - name: Whether the whole test suite passed
        uses: re-actors/alls-green@v1.2.2
        with:
          allowed-skips: ${{ toJSON(needs) }}
          jobs: ${{ toJSON(needs) }}
